<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#080b16" />
<title>Shuttle Feedback</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#080b16;
    --ink:#f5f6fb; --muted:#8b93b0; --faint:#5b627e;
    --violet:#a78bfa; --violet2:#8b5cf6; --indigo:#6366f1;
    --line:rgba(255,255,255,.09);
    --line2:rgba(167,139,250,.28);
    --danger:#fb7185;
    --r:18px;
    --font:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    --display:'Space Grotesk',var(--font);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{
    font-family:var(--font); color:var(--ink); min-height:100vh;
    padding:26px 18px 52px; line-height:1.4;
    background:
      radial-gradient(680px 420px at 12% -8%, rgba(139,92,246,.20), transparent 62%),
      radial-gradient(620px 460px at 108% 4%, rgba(99,102,241,.16), transparent 58%),
      radial-gradient(900px 700px at 50% 130%, rgba(76,110,245,.10), transparent 60%),
      var(--bg);
    background-attachment:fixed;
  }
  .wrap{max-width:480px; margin:0 auto;}

  /* ---------- header ---------- */
  header{display:flex; align-items:center; gap:14px; margin-bottom:26px;}
  .badge{
    width:52px; height:52px; border-radius:16px; flex:0 0 auto;
    display:flex; align-items:center; justify-content:center; font-size:26px;
    background:linear-gradient(150deg, rgba(167,139,250,.22), rgba(99,102,241,.10));
    border:1px solid var(--line2);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.08), 0 8px 22px rgba(99,102,241,.22);
  }
  header h1{font-family:var(--display); font-size:23px; margin:0; font-weight:700; letter-spacing:.2px;}
  header .sub{color:var(--muted); font-size:13.5px; margin-top:2px;}

  /* ---------- cards ---------- */
  .card{
    background:linear-gradient(180deg, rgba(255,255,255,.045), rgba(255,255,255,.02));
    border:1px solid var(--line); border-radius:var(--r);
    padding:20px; margin-bottom:16px;
    box-shadow:0 1px 0 rgba(255,255,255,.05) inset, 0 20px 40px -24px rgba(0,0,0,.9);
  }

  .label{font-size:11px; color:var(--muted); margin-bottom:11px; font-weight:600;
    text-transform:uppercase; letter-spacing:1.6px;}

  /* ---------- plate input ---------- */
  .row{display:flex; gap:10px; align-items:stretch; position:relative;}
  .field{
    display:flex; align-items:stretch; gap:0; flex:1; min-width:0;
    background:rgba(8,11,22,.6); border:1px solid var(--line);
    border-radius:14px; overflow:hidden; transition:.18s;
  }
  .field:focus-within{border-color:var(--violet); box-shadow:0 0 0 3px rgba(139,92,246,.18);}
  select{
    appearance:none; -webkit-appearance:none; border:none; outline:none;
    background:transparent; color:var(--violet); cursor:pointer;
    font-family:var(--display); font-size:20px; font-weight:700; letter-spacing:1px;
    padding:16px 30px 16px 16px;
    background-image:linear-gradient(45deg,transparent 50%,var(--violet) 50%),
                     linear-gradient(135deg,var(--violet) 50%,transparent 50%);
    background-position:calc(100% - 16px) 24px, calc(100% - 11px) 24px;
    background-size:5px 5px,5px 5px; background-repeat:no-repeat;
  }
  .divider{width:1px; background:var(--line); margin:10px 0;}
  input[type=text]{
    flex:1; min-width:0; border:none; outline:none; background:transparent;
    color:var(--ink); font-family:var(--display); font-size:22px; font-weight:600;
    letter-spacing:2px; padding:16px 14px; text-transform:uppercase;
  }
  input::placeholder{color:var(--faint); font-weight:500; letter-spacing:1px;}

  .reco{
    position:absolute; top:calc(100% + 8px); left:0; right:0; z-index:20;
    background:#101526; border:1.5px solid #3b82f6; border-radius:14px; overflow:hidden;
    box-shadow:0 0 0 3px rgba(59,130,246,.18), 0 20px 44px -12px rgba(0,0,0,.8); display:none;
  }
  .reco.show{display:block;}
  .reco-item{
    padding:14px 16px; font-family:var(--display); font-size:17px; font-weight:600; letter-spacing:1px;
    display:flex; align-items:center; justify-content:space-between; cursor:pointer;
    border-bottom:1px solid var(--line); color:var(--ink);
  }
  .reco-item:last-child{border-bottom:none;}
  .reco-item:active{background:rgba(139,92,246,.14);}
  .reco-item .tag{font-family:var(--font); font-size:11px; color:var(--violet);
    font-weight:600; letter-spacing:.4px;}

  /* ---------- preview ---------- */
  .preview{
    margin-top:14px; display:flex; align-items:center; justify-content:center; gap:12px;
    background:rgba(139,92,246,.06); border:1px solid var(--line2); border-radius:12px;
    padding:15px; min-height:34px;
  }
  .preview .val{font-family:var(--display); font-size:23px; font-weight:700; letter-spacing:3px;
    color:#fff; word-break:break-all;}
  .preview .ph{color:var(--faint); font-size:14px; font-weight:500;}
  .preview .ico{color:var(--violet); font-size:15px; opacity:.85;}

  /* ---------- GO (gradient outline) ---------- */
  .btn-go{
    flex:0 0 auto; cursor:pointer; border-radius:14px; padding:0 20px;
    font-family:var(--display); font-size:16px; font-weight:700; letter-spacing:1.5px; color:#fff;
    display:flex; align-items:center; justify-content:center; gap:7px;
    background:
      linear-gradient(180deg, rgba(139,92,246,.20), rgba(99,102,241,.12)) padding-box,
      linear-gradient(135deg, var(--violet), var(--indigo)) border-box;
    border:1.5px solid transparent;
    box-shadow:0 10px 24px -12px rgba(124,92,246,.8), inset 0 1px 0 rgba(255,255,255,.14);
    transition:.16s;
  }
  .btn-go:hover{box-shadow:0 14px 28px -10px rgba(124,92,246,.9), inset 0 1px 0 rgba(255,255,255,.2);}
  .btn-go:active{transform:translateY(1px) scale(.98);}
  .btn-go .icon{font-size:18px;}

  /* ---------- tools (ghost) ---------- */
  .tools{display:flex; gap:10px; margin-top:12px;}
  .tool{
    flex:1; cursor:pointer; border-radius:13px; padding:13px 10px;
    background:rgba(255,255,255,.03); border:1px solid var(--line);
    color:var(--ink); font-family:var(--font); font-size:14px; font-weight:600;
    display:flex; align-items:center; justify-content:center; gap:9px; transition:.16s;
  }
  .tool:hover{border-color:var(--line2); background:rgba(139,92,246,.08);}
  .tool:active{transform:scale(.98);}
  .tool .icon{font-size:18px;}

  .status{font-size:13.5px; margin-top:14px; text-align:center; min-height:18px;
    color:var(--muted); font-weight:500;}
  .status.err{color:#fda4b4;} .status.ok{color:var(--violet);} .status.busy{color:#7dd3fc;}
  #imgPreview{max-width:100%; border-radius:12px; margin-top:12px; display:none;
    border:1px solid var(--line);}

  /* ---------- saved ---------- */
  .section-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
  .section-title{font-family:var(--display); font-size:15px; font-weight:600; color:var(--ink);}
  .clear-all{background:none; border:none; color:var(--faint); font-family:var(--font);
    font-size:12.5px; font-weight:600; cursor:pointer; padding:4px;}
  .clear-all:active{color:var(--danger);}

  .saved-item{
    display:flex; align-items:center; gap:13px;
    background:rgba(255,255,255,.025); border:1px solid var(--line);
    border-radius:13px; padding:14px; margin-bottom:9px; cursor:pointer; transition:.15s;
  }
  .saved-item:hover{border-color:var(--line2); background:rgba(139,92,246,.07);}
  .saved-item:active{transform:scale(.99);}
  .saved-item .bar{width:3px; height:26px; border-radius:3px; flex:0 0 auto;
    background:linear-gradient(var(--violet),var(--indigo)); box-shadow:0 0 10px rgba(139,92,246,.6);}
  .saved-item .plate{flex:1; font-family:var(--display); font-weight:600; font-size:18px; letter-spacing:1.5px;}
  .saved-item .arrow{color:var(--violet); font-size:20px; font-weight:700;}
  .saved-item .del{background:transparent; border:none; color:var(--faint);
    font-size:16px; width:34px; height:34px; border-radius:9px; cursor:pointer; flex:0 0 auto;}
  .saved-item .del:hover{color:var(--danger); background:rgba(251,113,133,.1);}
  .empty{color:var(--faint); font-size:13.5px; text-align:center; padding:16px;}

  .listen-pulse{animation:pulse 1.1s infinite; border-color:var(--violet)!important;
    background:rgba(139,92,246,.14)!important;}
  @keyframes pulse{0%{opacity:1}50%{opacity:.5}100%{opacity:1}}
  .hint{font-size:12px; color:var(--faint); text-align:center; margin-top:8px;}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="badge">🚌</div>
    <div>
      <h1>Shuttle Feedback</h1>
      <div class="sub">Enter a plate and tap Go</div>
    </div>
  </header>

  <!-- ENTRY -->
  <div class="card">
    <div class="label">License Plate</div>
    <div class="row">
      <div class="field">
        <select id="state" aria-label="State code">
          <option value="TG">TG</option>
          <option value="TS">TS</option>
        </select>
        <div class="divider"></div>
        <input id="plate" type="text" inputmode="text" autocomplete="off" placeholder="09 EA 1234" />
      </div>
      <button class="btn-go" id="btnGo" aria-label="Go">GO<span class="icon">→</span></button>
      <div class="reco" id="reco"></div>
    </div>

    <div class="preview" id="preview"><span class="ph">Full number appears here</span></div>

    <div class="tools">
      <button class="tool" id="btnPhoto"><span class="icon">📷</span>Scan Plate</button>
      <button class="tool" id="btnVoice"><span class="icon">🎤</span>Speak</button>
    </div>

    <div class="status" id="status"></div>
    <img id="imgPreview" alt="captured plate" />
    <input id="cameraInput" type="file" accept="image/*" capture="environment" style="display:none" />
  </div>

  <!-- SAVED -->
  <div class="card">
    <div class="section-head">
      <div class="section-title">Saved Vehicles</div>
      <button class="clear-all" id="clearAll">Clear all</button>
    </div>
    <div id="savedList"></div>
    <div class="hint">Tap any vehicle to open its feedback page.</div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script>
(function(){
  "use strict";

  var BASE_URL = "https://qcommute.falconavl.com/hydemp/ShuttleFeedback/index.html?centerid=5&vehicleno=";
  var STORE_KEY = "shuttle_saved_plates_v1";

  var $ = function(id){ return document.getElementById(id); };
  var stateEl=$("state"), plateEl=$("plate"), previewEl=$("preview"),
      statusEl=$("status"), savedListEl=$("savedList"), recoEl=$("reco"),
      cameraInput=$("cameraInput"), imgPreview=$("imgPreview");

  /* ---------- helpers ---------- */
  function cleanRest(s){ return (s||"").toUpperCase().replace(/[^A-Z0-9]/g,""); }
  function fullPlate(){ return stateEl.value + cleanRest(plateEl.value); }
  function pretty(p){ return (p||"").replace(/^(T[GS])/, "$1 "); }

  function updatePreview(){
    var rest = cleanRest(plateEl.value);
    if(!rest){ previewEl.innerHTML='<span class="ph">Full number appears here</span>'; }
    else{ previewEl.innerHTML='<span class="ico">🚘</span><span class="val">'+stateEl.value+" "+rest+'</span>'; }
    showReco();
  }

  function setStatus(msg,kind){
    statusEl.className = "status" + (kind ? " "+kind : "");
    statusEl.textContent = msg||"";
  }

  function splitPlate(raw){
    var s = cleanRest(raw);
    if(s.indexOf("TG")===0) return {state:"TG", rest:s.slice(2)};
    if(s.indexOf("TS")===0) return {state:"TS", rest:s.slice(2)};
    return {state:null, rest:s};
  }
  function applyRaw(raw){
    var p = splitPlate(raw);
    if(p.state) stateEl.value = p.state;
    plateEl.value = p.rest;
    updatePreview();
  }

  /* ---------- storage ---------- */
  function loadSaved(){
    try{ return JSON.parse(localStorage.getItem(STORE_KEY)) || []; }catch(e){ return []; }
  }
  function persist(list){ localStorage.setItem(STORE_KEY, JSON.stringify(list)); }

  function remember(full){
    var list = loadSaved();
    list = list.filter(function(p){ return p !== full; });
    list.unshift(full);
    if(list.length > 50) list = list.slice(0,50);
    persist(list);
    renderSaved();
  }
  function deleteSaved(plate,ev){
    if(ev) ev.stopPropagation();
    persist(loadSaved().filter(function(p){ return p!==plate; }));
    renderSaved();
  }

  /* ---------- the one action: save + open ---------- */
  function go(plate){
    var full = plate || fullPlate();
    full = cleanRest(full);
    var rest = full.replace(/^T[GS]/, "");
    if(!rest){ setStatus("Enter a plate number first.", "err"); return; }
    remember(full);
    setStatus("Opening " + pretty(full) + " …", "ok");
    window.open(BASE_URL + encodeURIComponent(full), "_blank");
  }

  /* ---------- saved list (tap = go) ---------- */
  function renderSaved(){
    var list = loadSaved();
    savedListEl.innerHTML = "";
    if(!list.length){
      savedListEl.innerHTML = '<div class="empty">No saved vehicles yet.</div>';
      return;
    }
    list.forEach(function(plate){
      var row = document.createElement("div");
      row.className = "saved-item";
      row.onclick = function(){ go(plate); };

      var bar = document.createElement("div"); bar.className="bar"; row.appendChild(bar);

      var label = document.createElement("div");
      label.className="plate"; label.textContent = pretty(plate); row.appendChild(label);

      var arrow = document.createElement("div"); arrow.className="arrow"; arrow.textContent="›"; row.appendChild(arrow);

      var del = document.createElement("button");
      del.className="del"; del.textContent="🗑";
      del.onclick = function(e){ deleteSaved(plate,e); };
      row.appendChild(del);

      savedListEl.appendChild(row);
    });
  }

  /* ---------- recommendations while typing ---------- */
  function showReco(){
    var restTyped = cleanRest(plateEl.value);
    recoEl.innerHTML=""; recoEl.classList.remove("show");
    if(!restTyped) return;
    var matches = loadSaved().filter(function(p){
      var rest = splitPlate(p).rest;
      return rest.indexOf(restTyped) !== -1 && rest !== restTyped;
    }).slice(0,5);
    if(!matches.length) return;
    matches.forEach(function(p){
      var it = document.createElement("div");
      it.className="reco-item";
      it.innerHTML = '<span>'+pretty(p)+'</span><span class="tag">tap to open</span>';
      it.onclick = function(){ recoEl.classList.remove("show"); go(p); };
      recoEl.appendChild(it);
    });
    recoEl.classList.add("show");
  }

  /* ---------- photo OCR ---------- */
  function extractPlate(text){
    var s = (text||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
    var m = s.match(/T[GS]\d{1,2}[A-Z]{1,3}\d{3,4}/);
    if(m) return m[0];
    m = s.match(/[A-Z]{2}\d{1,2}[A-Z]{1,3}\d{3,4}/);
    if(m) return m[0];
    return null;
  }
  function runOCR(file){
    if(typeof Tesseract==="undefined"){ setStatus("OCR engine not loaded (check internet).","err"); return; }
    setStatus("Reading plate… a few seconds.","busy");
    Tesseract.recognize(file,"eng",{
      tessedit_char_whitelist:"ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789"
    }).then(function(res){
      var plate = extractPlate(res && res.data ? res.data.text : "");
      if(plate){ applyRaw(plate); setStatus("Detected "+pretty(plate)+" — verify, then GO.","ok"); }
      else{ setStatus("Couldn't read a plate. Type it manually.","err"); }
    }).catch(function(err){
      setStatus("OCR failed: "+(err&&err.message?err.message:err),"err");
    });
  }
  cameraInput.addEventListener("change",function(e){
    var file = e.target.files && e.target.files[0];
    if(!file) return;
    imgPreview.src = URL.createObjectURL(file);
    imgPreview.style.display="block";
    runOCR(file);
  });

  /* ---------- voice ---------- */
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  var recognizer=null, listening=false;
  function normalizeSpeech(t){
    t=(t||"").toUpperCase();
    var nw={ZERO:"0",OH:"0",O:"0",ONE:"1",TWO:"2",TO:"2",THREE:"3",FOUR:"4",FOR:"4",
            FIVE:"5",SIX:"6",SEVEN:"7",EIGHT:"8",NINE:"9"};
    var words=t.replace(/[^A-Z0-9 ]/g," ").split(/\s+/), out="";
    for(var i=0;i<words.length;i++){ var w=words[i]; if(!w) continue;
      out += (nw[w]!==undefined) ? nw[w] : w; }
    return out;
  }
  function startVoice(){
    if(!SR){ setStatus("Voice not supported on this browser.","err"); return; }
    if(listening && recognizer){ recognizer.stop(); return; }
    recognizer = new SR();
    recognizer.lang="en-IN"; recognizer.interimResults=false; recognizer.maxAlternatives=1;
    recognizer.onstart=function(){ listening=true; $("btnVoice").classList.add("listen-pulse");
      setStatus("Listening… say the plate.","busy"); };
    recognizer.onresult=function(ev){ var txt=ev.results[0][0].transcript;
      applyRaw(normalizeSpeech(txt)); setStatus("Heard “"+txt+"” — verify, then GO.","ok"); };
    recognizer.onerror=function(ev){ setStatus("Voice error: "+ev.error,"err"); };
    recognizer.onend=function(){ listening=false; $("btnVoice").classList.remove("listen-pulse"); };
    try{ recognizer.start(); }catch(e){ setStatus("Voice error: "+e.message,"err"); }
  }

  /* ---------- wire up ---------- */
  plateEl.addEventListener("input", updatePreview);
  stateEl.addEventListener("change", updatePreview);
  plateEl.addEventListener("keydown", function(e){ if(e.key==="Enter"){ e.preventDefault(); go(); } });
  $("btnGo").addEventListener("click", function(){ go(); });
  $("btnPhoto").addEventListener("click", function(){ cameraInput.click(); });
  $("btnVoice").addEventListener("click", startVoice);
  $("clearAll").addEventListener("click", function(){
    if(confirm("Remove all saved vehicles?")){ persist([]); renderSaved(); }
  });
  document.addEventListener("click", function(e){
    if(!recoEl.contains(e.target) && !e.target.closest(".field")) recoEl.classList.remove("show");
  });

  renderSaved();
  updatePreview();
})();
</script>
</body>
</html>
