<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#080b16" />
<title>Shuttle Feedback</title>

<!-- Mobile & Web App Icons -->
<link rel="icon" type="image/png" href="i912.png" />
<link rel="apple-touch-icon" href="i912.png" />
<link rel="shortcut icon" href="i912.png" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#080b16;
    --ink:#f5f6fb; --muted:#8b93b0; --faint:#5b627e;
    --violet:#a78bfa; --violet2:#8b5cf6; --indigo:#6366f1;
    --line:rgba(255,255,255,.09);
    --line2:rgba(167,139,250,.28);
    --danger:#fb7185;
    --r:18px;
    --font:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    --display:'Space Grotesk',var(--font);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{
    font-family:var(--font); color:var(--ink); min-height:100vh;
    padding:26px 18px 52px; line-height:1.4;
    background:
      radial-gradient(680px 420px at 12% -8%, rgba(139,92,246,.20), transparent 62%),
      radial-gradient(620px 460px at 108% 4%, rgba(99,102,241,.16), transparent 58%),
      radial-gradient(900px 700px at 50% 130%, rgba(76,110,245,.10), transparent 60%),
      var(--bg);
    background-attachment:fixed;
  }
  .wrap{max-width:480px; margin:0 auto;}

  /* ---------- header ---------- */
  header{display:flex; align-items:center; gap:14px; margin-bottom:26px;}
  .badge{
    width:52px; height:52px; border-radius:16px; flex:0 0 auto;
    display:flex; align-items:center; justify-content:center;
    background:linear-gradient(150deg, rgba(167,139,250,.22), rgba(99,102,241,.10));
    border:1px solid var(--line2);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.08), 0 8px 22px rgba(99,102,241,.22);
    overflow:hidden;
  }
  .badge img{width:100%; height:100%; object-fit:cover;}
  header h1{font-family:var(--display); font-size:23px; margin:0; font-weight:700; letter-spacing:.2px;}
  header .sub{color:var(--muted); font-size:13.5px; margin-top:2px;}

  /* ---------- cards ---------- */
  .card{
    background:linear-gradient(180deg, rgba(255,255,255,.045), rgba(255,255,255,.02));
    border:1px solid var(--line); border-radius:var(--r);
    padding:20px; margin-bottom:16px;
    box-shadow:0 1px 0 rgba(255,255,255,.05) inset, 0 20px 40px -24px rgba(0,0,0,.9);
  }

  .label{font-size:11px; color:var(--muted); margin-bottom:11px; font-weight:600;
    text-transform:uppercase; letter-spacing:1.6px;}

  /* ---------- plate input ---------- */
  .row{display:flex; gap:10px; align-items:stretch; position:relative;}
  .field{
    display:flex; align-items:stretch; gap:0; flex:1; min-width:0;
    background:rgba(8,11,22,.6); border:1px solid var(--line);
    border-radius:14px; overflow:hidden; transition:.18s;
  }
  .field:focus-within{border-color:var(--violet); box-shadow:0 0 0 3px rgba(139,92,246,.18);}
  select{
    appearance:none; -webkit-appearance:none; border:none; outline:none;
    background:transparent; color:var(--violet); cursor:pointer;
    font-family:var(--display); font-size:20px; font-weight:700; letter-spacing:1px;
    padding:16px 30px 16px 16px;
    background-image:linear-gradient(45deg,transparent 50%,var(--violet) 50%),
                     linear-gradient(135deg,var(--violet) 50%,transparent 50%);
    background-position:calc(100% - 16px) 24px, calc(100% - 11px) 24px;
    background-size:5px 5px,5px 5px; background-repeat:no-repeat;
  }
  .divider{width:1px; background:var(--line); margin:10px 0;}
  input[type=text]{
    flex:1; min-width:0; border:none; outline:none; background:transparent;
    color:var(--ink); font-family:var(--display); font-size:22px; font-weight:600;
    letter-spacing:2px; padding:16px 14px; text-transform:uppercase;
  }
  input::placeholder{color:var(--faint); font-weight:500; letter-spacing:1px;}

  .reco{
    position:absolute; top:calc(100% + 8px); left:0; right:0; z-index:20;
    background:#101526; border:1.5px solid #3b82f6; border-radius:14px; overflow:hidden;
    box-shadow:0 0 0 3px rgba(59,130,246,.18), 0 20px 44px -12px rgba(0,0,0,.8); display:none;
  }
  .reco.show{display:block;}
  .reco-item{
    padding:14px 16px; font-family:var(--display); font-size:17px; font-weight:600; letter-spacing:1px;
    display:flex; align-items:center; justify-content:space-between; cursor:pointer;
    border-bottom:1px solid var(--line); color:var(--ink);
  }
  .reco-item:last-child{border-bottom:none;}
  .reco-item:active{background:rgba(139,92,246,.14);}
  .reco-item .tag{font-family:var(--font); font-size:11px; color:var(--violet);
    font-weight:600; letter-spacing:.4px;}

  /* ---------- preview ---------- */
  .preview{
    margin-top:14px; display:flex; align-items:center; justify-content:center; gap:12px;
    background:rgba(139,92,246,.06); border:1px solid var(--line2); border-radius:12px;
    padding:15px; min-height:34px;
  }
  .preview .val{font-family:var(--display); font-size:23px; font-weight:700; letter-spacing:3px;
    color:#fff; word-break:break-all;}
  .preview .ph{color:var(--faint); font-size:14px; font-weight:500;}
  .preview .ico{color:var(--violet); font-size:15px; opacity:.85;}

  /* ---------- GO (gradient outline) ---------- */
  .btn-go{
    flex:0 0 auto; cursor:pointer; border-radius:14px; padding:0 20px;
    font-family:var(--display); font-size:16px; font-weight:700; letter-spacing:1.5px; color:#fff;
    display:flex; align-items:center; justify-content:center; gap:7px;
    background:
      linear-gradient(180deg, rgba(139,92,246,.20), rgba(99,102,241,.12)) padding-box,
      linear-gradient(135deg, var(--violet), var(--indigo)) border-box;
    border:1.5px solid transparent;
    box-shadow:0 10px 24px -12px rgba(124,92,246,.8), inset 0 1px 0 rgba(255,255,255,.14);
    transition:.16s;
  }
  .btn-go:hover{box-shadow:0 14px 28px -10px rgba(124,92,246,.9), inset 0 1px 0 rgba(255,255,255,.2);}
  .btn-go:active{transform:translateY(1px) scale(.98);}
  .btn-go .icon{font-size:18px;}

  /* ---------- tools (ghost) ---------- */
  .tools{display:flex; gap:10px; margin-top:12px;}
  .tool{
    flex:1; cursor:pointer; border-radius:13px; padding:13px 10px;
    background:rgba(255,255,255,.03); border:1px solid var(--line);
    color:var(--ink); font-family:var(--font); font-size:14px; font-weight:600;
    display:flex; align-items:center; justify-content:center; gap:9px; transition:.16s;
  }
  .tool:hover{border-color:var(--line2); background:rgba(139,92,246,.08);}
  .tool:active{transform:scale(.98);}
  .tool .icon{font-size:18px;}

  .status{font-size:13.5px; margin-top:14px; text-align:center; min-height:18px;
    color:var(--muted); font-weight:500;}
  .status.err{color:#fda4b4;} .status.ok{color:var(--violet);} .status.busy{color:#7dd3fc;}
  #imgPreview{max-width:100%; border-radius:12px; margin-top:12px; display:none;
    border:1px solid var(--line);}

  /* ---------- saved ---------- */
  .section-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
  .section-title{font-family:var(--display); font-size:15px; font-weight:600; color:var(--ink);}
  .clear-all{background:none; border:none; color:var(--faint); font-family:var(--font);
    font-size:12.5px; font-weight:600; cursor:pointer; padding:4px;}
  .clear-all:active{color:var(--danger);}

  .saved-item{
    display:flex; align-items:center; gap:13px;
    background:rgba(255,255,255,.025); border:1px solid var(--line);
    border-radius:13px; padding:14px; margin-bottom:9px; cursor:pointer; transition:.15s;
  }
  .saved-item:hover{border-color:var(--line2); background:rgba(139,92,246,.07);}
  .saved-item:active{transform:scale(.99);}
  .saved-item .bar{width:3px; height:26px; border-radius:3px; flex:0 0 auto;
    background:linear-gradient(var(--violet),var(--indigo)); box-shadow:0 0 10px rgba(139,92,246,.6);}
  .saved-item .plate{flex:1; font-family:var(--display); font-weight:600; font-size:18px; letter-spacing:1.5px;}
  .saved-item .arrow{color:var(--violet); font-size:20px; font-weight:700;}
  .saved-item .del{background:transparent; border:none; color:var(--faint);
    font-size:16px; width:34px; height:34px; border-radius:9px; cursor:pointer; flex:0 0 auto;}
  .saved-item .del:hover{color:var(--danger); background:rgba(251,113,133,.1);}
  .empty{color:var(--faint); font-size:13.5px; text-align:center; padding:16px;}

  .listen-pulse{animation:pulse 1.1s infinite; border-color:var(--violet)!important;
    background:rgba(139,92,246,.14)!important;}
  @keyframes pulse{0%{opacity:1}50%{opacity:.5}100%{opacity:1}}
  .hint{font-size:12px; color:var(--faint); text-align:center; margin-top:8px;}
</style>
</head>

<body>
<div class="wrap">

  <header>
    <div class="badge">
      <img src="i912.png" alt="Shuttle Icon" />
    </div>
    <div>
      <h1>Shuttle Feedback</h1>
      <div class="sub">Enter a plate and tap Go</div>
    </div>
  </header>

  <!-- ENTRY -->
  <div class="card">
    <div class="label">License Plate</div>
    <div class="row">
      <div class="field">
        <select id="state" aria-label="State code">
          <option value="TG">TG</option>
          <option value="TS">TS</option>
        </select>
        <div class="divider"></div>
        <input id="plate" type="text" inputmode="text" autocomplete="off" placeholder="09 EA 1234" />
      </div>
      <button class="btn-go" id="btnGo" aria-label="Go">GO<span class="icon">→</span></button>
      <div class="reco" id="reco"></div>
    </div>

        <div class="btn-row">
            <button class="submit-btn" onclick="openFeedback()">GO →</button>
            <button class="camera-btn" onclick="triggerCamera()" title="Scan Number Plate">
                <svg class="camera-icon" viewBox="0 0 24 24">
                    <path
                        d="M20 4h-3.17L15 2H9L7.17 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm-8 13c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z" />
                    <circle cx="12" cy="12" r="3" />
                </svg>
            </button>
        </div>

        <div id="recentSection" class="recent-section">
            <button class="recent-toggle" onclick="toggleRecentList()">
                <span>Recent Vehicles</span>
                <svg id="recentToggleIcon" viewBox="0 0 24 24">
                    <path d="M7 10l5 5 5-5z"/>
                </svg>
            </button>
            <div id="recentList" class="recent-list"></div>
        </div>

        <input type="file" id="cameraInput" accept="image/*" capture="environment">
    </div>

    <div class="modal-overlay" id="settingsModal">
        <div class="modal">
            <h3>⚙️ API Settings</h3>
            <p>Enter your <strong>Google Gemini API key</strong>.<br>
                Get one at <a href="https://aistudio.google.com/apikey" target="_blank">aistudio.google.com</a>
            </p>
            <input type="password" id="apiKeyInput" placeholder="Paste your Gemini API key">
            <div class="modal-btns">
                <button class="btn-cancel" onclick="closeSettings()">Cancel</button>
                <button class="btn-save" onclick="saveApiKey()">Save</button>
            </div>
        </div>
    </div>

    <script>
        const inputField = document.getElementById('vehicleNum');
        const stateSelect = document.getElementById('stateCode');
        const cameraInput = document.getElementById('cameraInput');
        const statusDiv = document.getElementById('ocr-status');
        const spinnerOverlay = document.getElementById('spinnerOverlay');
        const spinnerText = document.getElementById('spinnerText');
        const previewArea = document.getElementById('previewArea');
        const previewImg = document.getElementById('previewImg');
        const inputGroup = document.getElementById('inputGroup');
        const apiBadge = document.getElementById('apiBadge');
        const settingsModal = document.getElementById('settingsModal');
        const apiKeyInput = document.getElementById('apiKeyInput');
        const micBtn = document.getElementById('micBtn');
        const recentSection = document.getElementById('recentSection');
        const recentList = document.getElementById('recentList');
        const suggestionsList = document.getElementById('suggestionsList');

        let allRecentVehicles = []; // Store it in memory for quick filtering

        function getApiKey() { return localStorage.getItem('gemini_api_key') || ''; }

        function updateBadge() {
            const key = getApiKey();
            apiBadge.textContent = key ? 'GEMINI AI ✓' : 'NO API KEY';
            apiBadge.className = key ? 'api-badge connected' : 'api-badge disconnected';
        }

        function openSettings() {
            apiKeyInput.value = getApiKey();
            settingsModal.classList.add('active');
        }

        function closeSettings() { settingsModal.classList.remove('active'); }

        function saveApiKey() {
            const key = apiKeyInput.value.trim();
            key ? localStorage.setItem('gemini_api_key', key) : localStorage.removeItem('gemini_api_key');
            updateBadge();
            closeSettings();
        }

        settingsModal.addEventListener('click', (e) => { if (e.target === settingsModal) closeSettings(); });
        updateBadge();

        function handleInputSuggestions() {
            const val = inputField.value.trim().toUpperCase();
            if (!val) {
                suggestionsList.classList.remove('active');
                return;
            }

            // Simple "contains" match prioritizing the ending portion which the user types
            const state = stateSelect.value;
            const matches = allRecentVehicles.filter(v => v.includes(val) || v.startsWith(state + val));

            if (matches.length === 0) {
                suggestionsList.classList.remove('active');
                return;
            }

            suggestionsList.innerHTML = '';
            matches.forEach(match => {
                const div = document.createElement('div');
                div.className = 'suggestion-item';
                
                // Highlight the matched portion
                let innerHtml = match;
                if (match.startsWith(state + val)) {
                    innerHtml = `<span>${state}</span><strong>${val}</strong><span>${match.substring((state + val).length)}</span>`;
                } else {
                    const idx = match.indexOf(val);
                    if (idx > -1) {
                         innerHtml = `<span>${match.substring(0, idx)}</span><strong>${val}</strong><span>${match.substring(idx + val.length)}</span>`;
                    }
                }
                
                div.innerHTML = innerHtml;

                div.onmousedown = function(e) { 
                    e.preventDefault(); // Prevent blur when clicking item
                    applyPlateNumber(match);
                    suggestionsList.classList.remove('active');
                    openFeedback(); // Auto-submit
                };
                suggestionsList.appendChild(div);
            });
            suggestionsList.classList.add('active');
        }

        inputField.addEventListener('input', function () { 
            this.value = this.value.toUpperCase(); 
            handleInputSuggestions();
        });
        
        inputField.addEventListener('focus', handleInputSuggestions);
        inputField.addEventListener('blur', () => { setTimeout(() => { suggestionsList.classList.remove('active'); }, 150) });
        inputField.addEventListener('keydown', (e) => { if (e.key === 'Enter') openFeedback(); });

        function renderRecentList() {
            if (typeof chrome !== 'undefined' && chrome.storage && chrome.storage.local) {
                chrome.storage.local.get(['recent_vehicles'], function(result) {
                    allRecentVehicles = result.recent_vehicles || [];
                    displayRecentList(allRecentVehicles);
                });
            } else {
                allRecentVehicles = JSON.parse(localStorage.getItem('recent_vehicles') || '[]');
                displayRecentList(allRecentVehicles);
            }
        }

        function displayRecentList(recent) {
            if (recent.length === 0) {
                recentSection.classList.remove('active');
                return;
            }
            recentList.innerHTML = '';
            recent.forEach(no => {
                const div = document.createElement('div');
                div.className = 'recent-item';
                
                const textSpan = document.createElement('span');
                textSpan.innerText = no;
                div.appendChild(textSpan);

                const arrowIcon = document.createElement('div');
                arrowIcon.innerHTML = `<svg viewBox="0 0 24 24"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/></svg>`;
                div.appendChild(arrowIcon);

                div.onclick = function() { 
                    applyPlateNumber(no);
                    openFeedback(); // Auto-submit when clicking a recent item from the list
                };
                recentList.appendChild(div);
            });
            recentSection.classList.add('active');
        }

        // Render list immediately on load if anything exists
        renderRecentList();

        function toggleRecentList() {
            const list = document.getElementById('recentList');
            const toggle = document.querySelector('.recent-toggle');
            if (list) list.classList.toggle('open');
            if (toggle) toggle.classList.toggle('open');
        }

        function triggerCamera() { cameraInput.value = ''; cameraInput.click(); }
        function showSpinner(text) { spinnerText.innerText = text; spinnerOverlay.classList.add('active'); }
        function hideSpinner() { spinnerOverlay.classList.remove('active'); }
        function clearPreview() { previewArea.style.display = 'none'; previewImg.src = ''; }
        function flashSuccess() { inputGroup.classList.add('flash-success'); setTimeout(() => inputGroup.classList.remove('flash-success'), 600); }
        function flashError() { inputGroup.classList.add('flash-error'); setTimeout(() => inputGroup.classList.remove('flash-error'), 600); }

        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result.split(',')[1]);
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        async function extractPlateWithGemini(file) {
            const apiKey = getApiKey();
            if (!apiKey) throw new Error('NO_KEY');

            const base64Image = await fileToBase64(file);
            const mimeType = file.type || 'image/jpeg';
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

            const MAX_RETRIES = 3;
            for (let i = 0; i <= MAX_RETRIES; i++) {
                try {
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{
                                parts: [
                                    { text: "Extract ONLY the vehicle registration number. No spaces. Example: TG09EA1234. If not found, say NOT_FOUND." },
                                    { inline_data: { mime_type: mimeType, data: base64Image } }
                                ]
                            }],
                            generationConfig: { temperature: 0.1 }
                        })
                    });

                    if (response.status === 429 && i < MAX_RETRIES) {
                        const wait = Math.pow(2, i) * 2000;
                        await new Promise(r => setTimeout(r, wait));
                        continue;
                    }

                    if (!response.ok) throw new Error(response.status === 400 ? 'INVALID_KEY' : 'API_ERROR');

                    const data = await response.json();
                    const text = data.candidates?.[0]?.content?.parts?.[0]?.text || '';
                    return text.trim().toUpperCase().replace(/[^A-Z0-9]/g, '');
                } catch (err) {
                    if (i === MAX_RETRIES) throw err;
                }
            }
        }

        cameraInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const objectUrl = URL.createObjectURL(file);
            previewImg.src = objectUrl;
            previewArea.style.display = 'block';

            if (!getApiKey()) {
                statusDiv.innerText = "⚠ Set API key first (⚙️)";
                statusDiv.style.color = "#f59e0b";
                flashError();
                return;
            }

            showSpinner('Analyzing plate...');
            try {
                const plateText = await extractPlateWithGemini(file);
                hideSpinner();
                if (!plateText || plateText.includes('NOTFOUND') || plateText.length < 4) {
                    statusDiv.innerText = "Detection failed. Try again.";
                    statusDiv.style.color = "#ef4444";
                    flashError();
                } else {
                    applyPlateNumber(plateText);
                }
            } catch (err) {
                hideSpinner();
                statusDiv.innerText = err.message === 'INVALID_KEY' ? "❌ Invalid Key" : "Error. Try again.";
                statusDiv.style.color = "#ef4444";
                flashError();
            }
            setTimeout(() => { statusDiv.innerText = ""; }, 5000);
            URL.revokeObjectURL(objectUrl);
        });

        const KNOWN_STATES = ['TG', 'TS', 'AP', 'KA', 'MH', 'DL', 'TN', 'KL', 'UP', 'RJ', 'GJ', 'HR', 'PB', 'MP', 'WB'];

        function applyPlateNumber(plateText) {
            const first2 = plateText.substring(0, 2);
            if (KNOWN_STATES.includes(first2)) {
                stateSelect.value = first2;
                inputField.value = plateText.substring(2);
            } else {
                inputField.value = plateText;
            }
            statusDiv.innerText = "✓ Detected: " + plateText;
            statusDiv.style.color = "#22c55e";
            flashSuccess();
        }

        function saveRecentVehicle(fullNo) {
            if (typeof chrome !== 'undefined' && chrome.storage && chrome.storage.local) {
                chrome.storage.local.get(['recent_vehicles'], function(result) {
                    updateAndSaveList(result.recent_vehicles || [], fullNo, true);
                });
            } else {
                let recent = JSON.parse(localStorage.getItem('recent_vehicles') || '[]');
                updateAndSaveList(recent, fullNo, false);
            }
        }

        function updateAndSaveList(recent, fullNo, useChromeStorage) {
            const index = recent.indexOf(fullNo);
            if (index > -1) {
                recent.splice(index, 1);
            }
            recent.unshift(fullNo);
            if (recent.length > 5) recent.pop(); // Keep max 5 recent vehicles
            
            allRecentVehicles = recent; // Update in-memory copy
            renderRecentList(); // Re-render the bottom accordion to stay synced

            if (useChromeStorage) {
                chrome.storage.local.set({ 'recent_vehicles': recent });
            } else {
                localStorage.setItem('recent_vehicles', JSON.stringify(recent));
            }
        }

        function openFeedback() {
            const fullNo = stateSelect.value + inputField.value.trim().replace(/[^A-Z0-9]/gi, '').toUpperCase();
            if (!inputField.value.trim()) return alert("Enter vehicle number.");
            saveRecentVehicle(fullNo);
            window.location.href = `https://qcommute.falconavl.com/hydemp/ShuttleFeedback/index.html?centerid=5&vehicleno=${fullNo}`;
        }

        let recognition = null;
        let isListening = false;

        if ('SpeechRecognition' in window || 'webkitSpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.lang = 'en-IN'; // Works well for Indian vehicle plates

            recognition.onstart = function() {
                isListening = true;
                micBtn.classList.add('listening');
                statusDiv.innerText = "Listening...";
                statusDiv.style.color = "#818cf8";
            };

            recognition.onresult = function(event) {
                const transcript = event.results[0][0].transcript;
                const formatted = transcript.replace(/[^A-Za-z0-9]/g, '').toUpperCase();
                
                if (formatted) {
                    applyPlateNumber(formatted);
                } else {
                    statusDiv.innerText = "Could not detect plate number.";
                    statusDiv.style.color = "#ef4444";
                    flashError();
                }
            };

            recognition.onerror = function(event) {
                console.error("Speech recognition error", event.error);
                statusDiv.innerText = "Voice input failed: " + event.error;
                statusDiv.style.color = "#ef4444";
                flashError();
                stopListening();
            };

            recognition.onend = function() {
                stopListening();
            };
        } else {
            if (micBtn) micBtn.style.display = 'none';
        }

        function toggleVoiceInput() {
            if (!recognition) {
                alert("Voice input is not supported in your browser.");
                return;
            }
            if (isListening) {
                recognition.stop();
            } else {
                recognition.start();
            }
        }

        function stopListening() {
            isListening = false;
            micBtn.classList.remove('listening');
            if (statusDiv.innerText === "Listening...") {
                setTimeout(() => { if (statusDiv.innerText === "Listening...") statusDiv.innerText = ""; }, 500);
            }
        }
    </script>
</body>

</html>
